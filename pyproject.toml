[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opengrid-panelizer"
version = "0.1.0"
description = "Deterministic openGrid installation geometry and printable panel compiler"
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE.md", "src/opengrid/assets/native/ATTRIBUTION.md"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "shapely>=2.1,<3",
  "build123d>=0.10,<0.12",
  "PyYAML>=6,<7",
  "reportlab>=4,<5",
]

[project.urls]
Repository = "https://github.com/mgaruccio/opengrid-panelizer"
Issues = "https://github.com/mgaruccio/opengrid-panelizer/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "trimesh>=4,<5", "ruff>=0.12,<1"]

[project.scripts]
opengrid = "opengrid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opengrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
